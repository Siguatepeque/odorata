name: GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
# Build and deploy are separate jobs, as in GitHub's Pages starters: deploying in the same job looked the
# artifact up a fraction of a second after upload, before GitHub listed it, and failed with "no artifacts".
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Static export can't run the language proxy; public/index.html does its job in the browser.
      - run: rm proxy.ts && GITHUB_PAGES=1 npx next build
      - uses: actions/upload-pages-artifact@v5
        with: { path: out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v5
