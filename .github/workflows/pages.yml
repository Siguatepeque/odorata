name: GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Static export can't run the language proxy; public/index.html does its job in the browser.
      - run: rm proxy.ts && GITHUB_PAGES=1 npx next build
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - id: d
        uses: actions/deploy-pages@v4
